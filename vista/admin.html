<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .sidebar {
            width: 220px;
            background: #343a40;
            height: 100vh;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            padding: 20px;
        }

        .sidebar h4 {
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
        }

        .sidebar button {
            width: 100%;
            margin-bottom: 10px;
            background: #495057;
            border: none;
            color: white;
            padding: 10px;
            border-radius: 5px;
        }

        .sidebar button:hover {
            background: #6c757d;
        }

        .content {
            margin-left: 240px;
            padding: 20px;
        }

        table {
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h4>Administrador</h4>
        <button onclick="toggleSection('estudiantes')">Estudiantes</button>
        <button onclick="toggleSection('docentes')">Docentes</button>
        <button onclick="toggleSection('salas')">Salas</button>
        <button onclick="toggleSection('reservas')">Reservas</button>
    </div>

    <div class="content">
        <div id="estudiantes-section" class="section">
            <h3>Lista de Estudiantes</h3>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Correo</th>
                        <th>Fecha Registro</th>
                        <th>Activo</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div id="docentes-section" class="section" style="display:none;">
            <h3>Lista de Docentes</h3>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th>Activo</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div id="salas-section" class="section" style="display:none;">
            <h3>Salas Disponibles</h3>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Capacidad</th>
                        <th>Equipamiento</th>
                        <th>Estado</th>
                        <th>Tipo</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div id="reservas-section" class="section" style="display:none;">
            <h3>Reservas Activas</h3>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Estudiante</th>
                        <th>Sala</th>
                        <th>Fecha</th>
                        <th>Hora Inicio</th>
                        <th>Hora Fin</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        function toggleSection(section) {
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.getElementById(`${section}-section`).style.display = 'block';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            toggleSection('estudiantes');

            try {
                const response = await fetch('../controlador/AdminController.php');
                const data = await response.json();

                renderTabla('estudiantes', data.estudiantes, ['id_usuario', 'nombre', 'apellido', 'correo', 'fecha_registro', 'activo']);
                renderTabla('docentes', data.docentes, ['id_usuario', 'nombre', 'apellido', 'correo', 'rol', 'activo']);
                renderTabla('salas', data.salas, ['id_sala', 'nombre', 'capacidad', 'equipamiento', 'estado', 'tipo']);
                renderTabla('reservas', data.reservas, ['id_reserva', 'estudiante', 'sala', 'fecha', 'hora_inicio', 'hora_fin', 'estado']);
            } catch (error) {
                console.error('Error cargando datos:', error);
            }
        });

        function renderTabla(nombre, data, campos) {
            const tbody = document.querySelector(`#${nombre}-section tbody`);
            tbody.innerHTML = '';

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${campos.length}" class="text-center text-muted">No hay datos disponibles</td></tr>`;
                return;
            }

            data.forEach(fila => {
                const tr = document.createElement('tr');
                campos.forEach(campo => {
                    const td = document.createElement('td');
                    td.textContent = fila[campo];
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }
    </script>
</body>

</html>

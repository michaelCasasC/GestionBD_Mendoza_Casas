<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Salas - Sistema de Reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-dark: #00312D;
            --accent-green: #BFF102;
        }

        .btn-accent {
            background-color: var(--accent-green);
            color: var(--primary-dark);
            border: none;
            font-weight: 600;
        }

        .btn-accent:hover {
            background-color: #a8d900;
        }

        .table-custom th {
            background-color: var(--primary-dark);
            color: white;
            border: none;
        }
    </style>
</head>

<body>
    <div class="container mt-4">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3">
                <i class="bi bi-door-closed me-2"></i>Gestión de Salas de Estudio
            </h1>
            <button class="btn btn-accent">
                <i class="bi bi-plus-circle me-1"></i>Agregar Nueva Sala
            </button>
        </div>

        <!-- Formulario para Agregar/Editar Sala -->
        <div class="card mb-4">
            <div class="card-header bg-light">
                <h5 class="mb-0">Agregar Nueva Sala</h5>
            </div>
            <div class="card-body">
                <form>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Nombre de la Sala</label>
                            <input type="text" class="form-control" placeholder="Ej: Sala A-101">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Capacidad</label>
                            <input type="number" class="form-control" placeholder="Ej: 6">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Estado</label>
                            <select class="form-select">
                                <option value="activa">Activa</option>
                                <option value="mantenimiento">En Mantenimiento</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Equipamiento</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="proyector">
                            <label class="form-check-label" for="proyector">Proyector</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="pizarra">
                            <label class="form-check-label" for="pizarra">Pizarra</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="computadoras">
                            <label class="form-check-label" for="computadoras">Computadoras</label>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-accent">Guardar Sala</button>
                        <button type="button" class="btn btn-secondary">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Lista de Salas -->
        <div class="card">
            <div class="card-header bg-light">
                <h5 class="mb-0">Lista de Salas</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-custom mb-0">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Capacidad</th>
                                <th>Equipamiento</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><strong>Sala A-101</strong></td>
                                <td>4 personas</td>
                                <td>Proyector, Pizarra</td>
                                <td>
                                    <span class="badge bg-success">Activa</span>
                                </td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary me-1">
                                        <i class="bi bi-pencil"></i> Editar
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-x-circle"></i> Deshabilitar
                                    </button>
                                </td>
                            </tr>
                            <tr>
                                <td><strong>Sala B-205</strong></td>
                                <td>6 personas</td>
                                <td>Pizarra, Computadoras</td>
                                <td>
                                    <span class="badge bg-success">Activa</span>
                                </td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary me-1">
                                        <i class="bi bi-pencil"></i> Editar
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-x-circle"></i> Deshabilitar
                                    </button>
                                </td>
                            </tr>
                            <tr>
                                <td><strong>Sala C-102</strong></td>
                                <td>8 personas</td>
                                <td>Proyector</td>
                                <td>
                                    <span class="badge bg-warning text-dark">En Mantenimiento</span>
                                </td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary me-1">
                                        <i class="bi bi-pencil"></i> Editar
                                    </button>
                                    <button class="btn btn-sm btn-outline-success">
                                        <i class="bi bi-check-circle"></i> Habilitar
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
